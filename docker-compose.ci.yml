version: '3.8'

# CI-specific Docker Compose configuration
# This builds the services and runs them for testing

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sosc_db
    ports:
      - "5432:5432"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: sosc_db
      DB_PASSWORD: postgres
      DB_PORT: 5432
      PORT: 5000
      NODE_ENV: test
      JWT_SECRET: test-secret-key
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REACT_APP_API_URL: http://backend:5000
      CI: true
    depends_on:
      - backend
