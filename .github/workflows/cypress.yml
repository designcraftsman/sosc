name: Cypress Tests
on: [push]
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sosc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci
      
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Install Cypress Dependencies
        run: npm ci
      
      - name: Start Backend Server
        working-directory: backend
        run: |
          npm start &
          sleep 5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sosc_test
          NODE_ENV: test
          JWT_SECRET: test-secret-key
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: 587
          EMAIL_USER: test@example.com
          EMAIL_PASSWORD: test-password
      
      - name: Start Frontend Server
        working-directory: frontend
        run: |
          npm start &
        env:
          CI: false
      
      - name: Wait for servers
        run: |
          npx wait-on http://localhost:5000 http://localhost:3000 --timeout 120000
      
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          record: true
          parallel: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}