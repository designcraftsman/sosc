name: Cypress Tests
on: [push]
jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2] # Uses 2 parallel instances
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.ci.yml up -d
          docker compose -f docker-compose.ci.yml ps
      
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:5000/api/health || curl -f http://localhost:5000; do sleep 2; done' || echo "Backend might not have health endpoint, continuing..."
          echo "Waiting for frontend to be ready..."
          timeout 90 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'
          echo "All services are ready!"
      
      - name: Show service logs
        if: always()
        run: docker compose -f docker-compose.ci.yml logs
      
      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: true
          wait-on: 'http://localhost:3000, http://localhost:5000'
          wait-on-timeout: 120
          record: true
          parallel: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
          # Creating a token https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/creating-a-personal-access-token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}